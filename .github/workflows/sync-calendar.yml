name: Sync Calendar

on:
  schedule:
    - cron: "0 5 * * *"     # 05:00 UTC daily (~07:00 Malta summer)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r scripts/requirements.txt
      - name: Pull green calendar events
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CALENDAR_IDS: ${{ vars.CALENDAR_IDS }}   # optional repo variable; falls back to primary
        run: python scripts/sync_calendar.py
      - name: Commit if changed
        run: |
          git config user.name "calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/calendar.json
          git diff --cached --quiet || git commit -m "chore: calendar sync $(date -u +%FT%TZ)"
          git push
