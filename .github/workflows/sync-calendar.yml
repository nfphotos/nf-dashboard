name: Sync Calendar

on:
  schedule:
    - cron: "0 5 * * *"     # 05:00 UTC daily (~07:00 Malta summer)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r scripts/requirements.txt
      - name: Pull fixtures from Google Calendar
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CALENDAR_IDS: ${{ vars.CALENDAR_IDS }}   # optional repo variable; falls back to primary
          # Encrypts the full diary. Without it, only fixtures are published —
          # the personal schedule is never written in the clear.
          CALENDAR_PASSPHRASE: ${{ secrets.CALENDAR_PASSPHRASE }}
        run: python scripts/sync_calendar.py

      # Rebase-and-retry: the Calendar and Garmin syncs both commit to main and
      # will collide if they ever overlap (a plain `git push` loses the race and
      # fails the run even though the data was fetched fine).
      - name: Commit if changed
        run: |
          git config user.name "calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/calendar.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "chore: calendar sync $(date -u +%FT%TZ)"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            echo "push attempt $attempt lost the race; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::could not push after 3 attempts"
          exit 1

  # Deploy the freshly committed data. A push made with GITHUB_TOKEN does not
  # trigger the on:push deploy, so without this the JSON lands in the repo but
  # never reaches the site.
  deploy:
    needs: sync
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
