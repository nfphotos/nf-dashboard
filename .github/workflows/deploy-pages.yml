name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # Callable by the sync workflows. Pushes made with the default GITHUB_TOKEN
  # deliberately do NOT trigger other workflows, so the bot committing fresh
  # Garmin/Calendar data would never deploy it — the site quietly served
  # whatever a human push last shipped. The syncs now call this directly.
  workflow_call: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Explicitly the tip of main, not the default ref. When a sync workflow
      # calls this, the default is the SHA that TRIGGERED that run — i.e. the
      # state before the bot committed its fresh data — so the deploy would
      # succeed while shipping the previous version. Bit us with the diary.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
